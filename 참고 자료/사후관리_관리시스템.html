<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>함께일하는재단 통합관리시스템</title>
<style>
  :root{
    --bg:#f6f5f1; --surface:#ffffff; --line:#e4e2da; --line2:#d3d1c7;
    --text:#2c2c2a; --muted:#73726c; --faint:#9c9a92;
    --accent:#1d7a5f; --accent-bg:#e1f5ee;
    --t-general:#0f6e56; --t-general-bg:#e1f5ee;
    --t-intensive:#854f0b; --t-intensive-bg:#faeeda;
    --t-growth:#993c1d; --t-growth-bg:#faece7;
    --t-watch:#5f5e5a; --t-watch-bg:#f1efe8;
    --radius:10px; --radius-sm:7px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .head-in{display:flex;align-items:center;gap:24px;height:60px}
  .logo{font-size:16px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
  .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  nav{display:flex;gap:4px;margin-left:auto}
  .nav-btn{border:none;background:none;color:var(--muted);padding:8px 14px;border-radius:var(--radius-sm);font-size:14px;font-weight:500}
  .nav-btn:hover{background:var(--bg)}
  .nav-btn.active{background:var(--accent-bg);color:var(--accent)}

  main{padding:28px 0 80px}
  .page-title{font-size:21px;font-weight:600;letter-spacing:-.3px;margin-bottom:4px}
  .page-sub{color:var(--muted);font-size:13.5px;margin-bottom:22px}

  .grid-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
  .metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .metric .lbl{font-size:12.5px;color:var(--muted);margin-bottom:7px}
  .metric .val{font-size:27px;font-weight:600;letter-spacing:-.5px}
  .metric .val small{font-size:14px;color:var(--faint);font-weight:500;margin-left:3px}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px}
  .panel h3{font-size:14.5px;font-weight:600;margin-bottom:14px}

  .dist-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .dist-row .name{width:96px;font-size:13px;color:var(--muted);flex-shrink:0}
  .dist-bar{flex:1;height:22px;background:var(--bg);border-radius:5px;overflow:hidden}
  .dist-fill{height:100%;border-radius:5px;min-width:2px;transition:width .4s}
  .dist-row .cnt{width:34px;text-align:right;font-weight:600;font-size:13px}
  .stage-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .stage-stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 12px;text-align:center;cursor:pointer}
  .stage-stat:hover{background:#fbfaf7;border-color:var(--line2)}
  .stage-stat .ss-num{font-size:24px;font-weight:600;letter-spacing:-.5px}
  .stage-stat .ss-lbl{font-size:12.5px;color:var(--muted);margin-top:3px}
  .settle-head,.settle-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.5fr 26px;gap:8px;align-items:center}
  .settle-head{font-size:12px;color:var(--muted);margin-bottom:6px}
  .settle-row{margin-bottom:8px}
  .settle-row input{padding:8px 10px;border:1px solid var(--line2);border-radius:var(--radius-sm);outline:none;width:100%}
  .settle-row input:focus{border-color:var(--accent)}
  .settle-del{border:none;background:none;color:var(--faint);font-size:16px;cursor:pointer;border-radius:50%}
  .settle-del:hover{background:#f0dede;color:#a32d2d}
  .settle-totals{display:flex;gap:18px;flex-wrap:wrap;background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;margin-top:4px;font-size:13px;color:var(--muted)}
  .settle-totals b{color:var(--text);font-weight:600}
  .file-list{display:flex;flex-direction:column;gap:6px;margin:2px 0 10px}
  .file-item{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 10px}
  .file-name{flex:1;font-size:13px;color:var(--accent);cursor:pointer;text-decoration:underline;word-break:break-all}
  .file-size{font-size:12px;color:var(--faint)}
  .file-del{border:none;background:none;color:var(--faint);font-size:16px;cursor:pointer;border-radius:50%;width:22px;height:22px}
  .file-del:hover{background:#f0dede;color:#a32d2d}
  .uploader{display:inline-flex;align-items:center;gap:8px;margin-bottom:6px}
  .call-image{width:100%;max-height:180px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--line);margin-bottom:12px;background:var(--bg)}
  .call-thumb{width:64px;height:64px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--line);flex-shrink:0;background:var(--bg)}
  .consent-box{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px}
  .consent-row{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer}
  .consent-row input{width:16px;height:16px;flex-shrink:0}
  .consent-row .req{color:#a32d2d;font-size:12px}
  .consent-row .opt{color:var(--faint);font-size:12px}
  .consent-tags{display:flex;flex-wrap:wrap;gap:6px}
  .consent-tag{font-size:11.5px;padding:2px 8px;border-radius:5px;background:var(--t-general-bg);color:var(--t-general)}
  .consent-tag.no{background:var(--bg);color:var(--faint)}
  .kpi-head,.kpi-row{display:grid;grid-template-columns:1.6fr 1fr 1fr 70px 26px;gap:8px;align-items:center}
  .kpi-head{font-size:12px;color:var(--muted);margin-bottom:6px}
  .kpi-row{margin-bottom:8px}
  .kpi-row input{padding:8px 10px;border:1px solid var(--line2);border-radius:var(--radius-sm);outline:none;width:100%}
  .kpi-rate{font-size:13px;font-weight:600;text-align:center}
  .timeline{display:flex;flex-direction:column;gap:0;margin:6px 0 10px}
  .tl-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .tl-item:last-child{border-bottom:none}
  .tl-date{font-size:12px;color:var(--muted);width:84px;flex-shrink:0}
  .tl-type{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--accent-bg);color:var(--accent);height:fit-content}
  .tl-note{flex:1;font-size:13px}
  .tl-del{border:none;background:none;color:var(--faint);cursor:pointer;font-size:14px}
  .flag-warn{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px;background:#faece7;color:#a32d2d}

  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;height:38px;padding:0 14px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--surface);outline:none}
  .search input:focus{border-color:var(--accent)}
  .filter-sel{height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none}

  .btn{height:38px;padding:0 16px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--bg)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#176a52}
  .btn.danger{color:#a32d2d;border-color:#e9c5c5}
  .btn.danger:hover{background:#fceaea}
  .btn.sm{height:30px;padding:0 11px;font-size:12.5px}

  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  thead th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:11px 16px;border-bottom:1px solid var(--line);background:#fbfaf7}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#fbfaf7}
  .empty{text-align:center;color:var(--faint);padding:42px 0}

  .badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .b-general{background:var(--t-general-bg);color:var(--t-general)}
  .b-intensive{background:var(--t-intensive-bg);color:var(--t-intensive)}
  .b-growth{background:var(--t-growth-bg);color:var(--t-growth)}
  .b-watch{background:var(--t-watch-bg);color:var(--t-watch)}
  .stage-tag{font-size:12px;color:var(--muted);background:var(--bg);padding:3px 9px;border-radius:5px}
  .kind-tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px}
  .kind-org{background:#e6f1fb;color:#185fa5}
  .kind-ind{background:#eeedfe;color:#534ab7}

  .detail-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0}
  .detail-head .nm{font-size:18px;font-weight:600;letter-spacing:-.2px}
  .detail-head .meta{color:var(--muted);font-size:13px;margin-top:1px}
  .detail-head .badges{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .id-line{font-size:12px;color:var(--faint);margin:6px 0 0 60px}

  .stage-bar{display:flex;gap:6px;margin:20px 0 18px}
  .stage-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 2px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
  .stage-step:hover{background:var(--bg)}
  .stage-step.on{border-color:var(--accent);background:var(--accent-bg)}
  .stage-step .num{width:23px;height:23px;border-radius:50%;background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
  .stage-step.on .num{background:var(--accent);color:#fff}
  .stage-step .stp-lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
  .stage-step.on .stp-lbl{color:var(--accent)}
  .stage-step.done .num{background:var(--t-general-bg);color:var(--t-general)}

  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:62px;line-height:1.5}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

  .segmented{display:inline-flex;border:1px solid var(--line2);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:18px}
  .segmented button{border:none;background:var(--surface);color:var(--muted);padding:9px 20px;font-size:13.5px;font-weight:500}
  .segmented button.on{background:var(--accent);color:#fff}
  .segmented button+button{border-left:1px solid var(--line2)}

  .diag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .diag-item label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px}
  .diag-item select{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)}

  .class-result{background:var(--bg);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:16px}
  .class-result .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .class-result .axis{font-size:13px;color:var(--muted)}
  .class-result .axis b{color:var(--text);font-weight:600}
  .class-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6}

  .save-bar{display:flex;gap:10px;align-items:center;margin-top:8px}
  .saved-msg{color:var(--accent);font-size:13px;font-weight:500;opacity:0;transition:opacity .3s}
  .saved-msg.show{opacity:1}
  .back-link{border:none;background:none;color:var(--muted);font-size:13px;font-weight:500;padding:0;margin-bottom:14px;display:inline-flex;align-items:center;gap:5px}
  .back-link:hover{color:var(--text)}
  .hint{font-size:12.5px;color:var(--faint);margin-top:-8px;margin-bottom:16px}

  .chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 13px;font-size:13px}
  .chip button{border:none;background:none;color:var(--faint);font-size:15px;line-height:1;width:20px;height:20px;border-radius:50%}
  .chip button:hover{background:#f0dede;color:#a32d2d}
  .add-row{display:flex;gap:8px}
  .add-row input{flex:1;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:var(--radius-sm);outline:none}
  .add-row input:focus{border-color:var(--accent)}
  @media(max-width:620px){.field-row,.field-row-3{grid-template-columns:1fr}.stage-step .stp-lbl{display:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header id="appHeader">
  <div class="wrap head-in">
    <div class="logo"><span class="dot"></span>함께일하는재단 통합관리시스템</div>
    <nav>
      <button class="nav-btn active" data-view="dashboard" onclick="go('dashboard')">대시보드</button>
      <button class="nav-btn" data-view="list" onclick="go('list')">참여자 목록</button>
      <button class="nav-btn" data-view="calls" onclick="go('calls')">공모사업</button>
      <button class="nav-btn" data-view="stats" onclick="go('stats')">통계</button>
      <button class="nav-btn" data-view="new" onclick="go('new')">신규 등록</button>
      <button class="nav-btn" data-view="admin" onclick="go('admin')">관리자</button>
    </nav>
    <button class="nav-btn" onclick="logout()" style="color:var(--faint)">로그아웃</button>
  </div>
</header>
<main><div class="wrap" id="root"></div></main>
<footer style="border-top:1px solid var(--line);margin-top:8px;padding:24px 20px 44px;text-align:center">
  <div style="display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:500;margin-bottom:6px">
    <span style="width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block"></span>함께일하는재단 통합관리시스템
  </div>
  <div style="color:var(--faint);font-size:11.5px;letter-spacing:.2px">© 2026 임지연 연구소 · All rights reserved.</div>
  <div style="color:var(--faint);font-size:11px;margin-top:3px">본 시스템에 대한 모든 저작권은 임지연 연구소에 귀속됩니다.</div>
</footer>

<script>
const STAGES = ["신청","심사","사업진행","종료","사후관리"];
const AXES = [
  {k:"accounting",  label:"회계·행정 역량"},
  {k:"execution",   label:"사업수행 역량"},
  {k:"outcome",     label:"성과 달성도"},
  {k:"sustainability", label:"자립 가능성"},
  {k:"linkage",     label:"재단 연계 관심"},
];
const SCORE_OPT = {1:"미흡",2:"보통",3:"우수"};
const CLASS_META = {
  "성장연계":{cls:"b-growth", color:"--t-growth"},
  "집중관리":{cls:"b-intensive", color:"--t-intensive"},
  "일반 모니터링":{cls:"b-general", color:"--t-general"},
  "관찰":{cls:"b-watch", color:"--t-watch"},
  "미분류":{cls:"b-watch", color:"--t-watch"},
};
const REGION = {
  "서울특별시":["종로구","중구","용산구","성동구","광진구","동대문구","중랑구","성북구","강북구","도봉구","노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구","관악구","서초구","강남구","송파구","강동구"],
  "부산광역시":["중구","서구","동구","영도구","부산진구","동래구","남구","북구","해운대구","사하구","금정구","강서구","연제구","수영구","사상구","기장군"],
  "대구광역시":["중구","동구","서구","남구","북구","수성구","달서구","달성군","군위군"],
  "인천광역시":["중구","동구","미추홀구","연수구","남동구","부평구","계양구","서구","강화군","옹진군"],
  "광주광역시":["동구","서구","남구","북구","광산구"],
  "대전광역시":["동구","중구","서구","유성구","대덕구"],
  "울산광역시":["중구","남구","동구","북구","울주군"],
  "세종특별자치시":["세종시"],
  "경기도":["수원시","성남시","의정부시","안양시","부천시","광명시","평택시","동두천시","안산시","고양시","과천시","구리시","남양주시","오산시","시흥시","군포시","의왕시","하남시","용인시","파주시","이천시","안성시","김포시","화성시","광주시","양주시","포천시","여주시","연천군","가평군","양평군"],
  "강원특별자치도":["춘천시","원주시","강릉시","동해시","태백시","속초시","삼척시","홍천군","횡성군","영월군","평창군","정선군","철원군","화천군","양구군","인제군","고성군","양양군"],

function computeClass(o){
  const s=o.scores; const filled=AXES.every(a=>s[a.k]>0);
  if(!filled) return {label:"미분류", stability:null, potential:null, filled:false};
  const stability=s.accounting+s.sustainability, potential=s.execution+s.outcome+s.linkage;
  const stHigh=stability>=5, potHigh=potential>=7;
  let label = stHigh&&potHigh?"성장연계" : !stHigh&&potHigh?"집중관리" : stHigh&&!potHigh?"일반 모니터링" : "관찰";
  return {label, stability, potential, filled:true};
}

async function createOrg(){

}

function doSignup(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
  const loginId=g("su_id"), pw=g("su_pw"), name=g("su_name");
  const err=msg=>{ const e=document.getElementById("su_err"); if(e){e.textContent=msg;e.style.display="block";} };
  if(!loginId||!pw||!name){ err("필수 항목(아이디·비밀번호·이름)을 입력하세요."); return; }
  if(loginId.toLowerCase()===ADMIN_ID.toLowerCase()){ err("사용할 수 없는 아이디입니다."); return; }
  if(state.accounts.some(a=>a.loginId.toLowerCase()===loginId.toLowerCase())){ err("이미 가입된 아이디입니다."); return; }
  const chk=k=>{const e=document.getElementById("su_consent_"+k);return e?e.checked:false;};
  if(!chk("collect")){ err("필수 항목인 개인정보 수집·이용에 동의해야 가입할 수 있습니다."); return; }
  const consents={ version:CONSENT_VERSION, agreedAt:new Date().toISOString().slice(0,10) };
  CONSENTS.forEach(c=>consents[c.k]=chk(c.k));
  const acc={ id:"ACC-"+Date.now().toString(36), loginId, password:pw, kind:state.signupKind, name,
    type:g("su_type"), affiliation:g("su_affil"), founded:g("su_founded"), rep:g("su_rep"), contact:g("su_contact"),
    sido:g("su_sido"), sigungu:g("su_gu"), ageBand:g("su_age"), scale:g("su_scale"), consents,
    createdAt:new Date().toISOString().slice(0,10) };
  state.accounts.push(acc);
  saveStore().then(()=>{ state.adminAuth=false; state.partAuth=true; state.currentAccountId=acc.id; state.partView="calls"; state.authView="login"; render(); });
}

function submitApply(){
  const c=state.calls.find(x=>x.id===state.applyCallId); if(!c)return;
  const acc=currentAccount(); if(!acc)return;
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
  const chk=id=>{const e=document.getElementById(id);return e?e.checked:false;};
  if(!chk("a_consent_collect")){ alert("개인정보 수집·이용(필수)에 동의해야 신청할 수 있습니다."); return; }
  const consents=Object.assign(blankConsents(), acc.consents||{}, {collect:true, version:CONSENT_VERSION, agreedAt:new Date().toISOString().slice(0,10)});
  if(chk("a_consent_followup")) consents.followup=true;
  const o=createApplication(c, { kind:acc.kind, name:acc.name, contact:acc.contact, sido:g("a_sido"), sigungu:g("a_gu"),
    type:acc.type, founded:acc.founded, rep:acc.rep, affiliation:acc.affiliation, motive:g("a_motive"), budget:g("a_budget"),
    ageBand:acc.ageBand, scale:acc.scale, consents });
  o.accountId=acc.id;
  o.attachments=state.applyFiles.slice();
  state.orgs.unshift(o);
  saveStore().then(()=>{ state.applyCallId=null; state.applyFiles=[]; state.partView="myapps"; render(); alert("신청이 접수되었습니다. ‘내 신청내역’에서 진행 상태를 확인할 수 있습니다."); });
}
function partStatus(o){
  const r=o.review&&o.review.result;

  if(o.stage>=2) return {label:"사업 진행 중", cls:"b-general"};
  if(r==="선정") return {label:"선정", cls:"b-growth"};

}

async function addApplyFile(input){
  const files=[...input.files]; input.value="";
  for(const f of files){
    if(f.size>MAX_FILE){ alert(`"${f.name}"은(는) 3MB를 초과해 첨부할 수 없습니다.`); continue; }
    const d=await readFileAsDataUrl(f); const key=await putFile(d);
    if(key) state.applyFiles.push({name:f.name,type:f.type,size:f.size,key});
  }
  render();
}

async function addCardFile(input, field){
  const o=state.orgs.find(x=>x.id===state.activeId); if(!o){ input.value=""; return; }
  if(!o[field])o[field]=[];
  const files=[...input.files]; input.value="";
  for(const f of files){
    if(f.size>MAX_FILE){ alert(`"${f.name}"은(는) 3MB를 초과해 첨부할 수 없습니다.`); continue; }
    const d=await readFileAsDataUrl(f); const key=await putFile(d);
    if(key) o[field].push({name:f.name,type:f.type,size:f.size,key});
  }
  await saveStore(); render();
}

function viewStats(){
  const orgs=state.orgs;
  const tally=(fn)=>{const c={};orgs.forEach(o=>{const k=fn(o);if(k)c[k]=(c[k]||0)+1;});return c;};
  const consentTally=(key)=>{let y=0,n=0;orgs.forEach(o=>{(o.consents&&o.consents[key])?y++:n++;});return {"동의":y,"미동의":n};};
  const bar=(title,counts)=>{
    const entries=Object.entries(counts).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    const max=Math.max(1,...entries.map(e=>e[1]));
    return `<div class="panel"><h3>${title}</h3>${entries.length?entries.map(([k,v])=>`<div class="dist-row"><span class="name" style="width:130px">${esc(k)}</span><div class="dist-bar"><div class="dist-fill" style="width:${Math.round(v/max*100)}%;background:var(--accent)"></div></div><span class="cnt">${v}</span></div>`).join(""):`<div class="hint">데이터가 없습니다.</div>`}</div>`;
  };
  return `
  <div class="page-title">통계</div>
  <div class="page-sub">모집·참여자 분포와 동의 현황을 한눈에 봅니다. (전체 ${orgs.length}건)</div>

  ${bar("공모사업별 신청", tally(o=>o.program||'미지정'))}
  ${bar("분류", tally(o=>effectiveClass(o)))}
  ${bar("단계", tally(o=>STAGES[o.stage]))}
  ${bar("지역(시·도)", tally(o=>o.sido||'미입력'))}
  ${bar("기관 유형", tally(o=>o.kind!=='individual'?(o.type||'미입력'):null))}
  ${bar("규모(기관)", tally(o=>o.kind!=='individual'?(o.scale||'미입력'):null))}
  ${bar("연령대(개인)", tally(o=>o.kind==='individual'?(o.ageBand||'미입력'):null))}
  ${bar("후속지원 안내 동의", consentTally('followup'))}
  ${bar("조사 참여 동의", consentTally('survey'))}`;
}

async function saveCall(){
  const c=state.callEdit; const g=id=>{const e=document.getElementById(id);return e?e.value:"";};
  c.title=g("c_title").trim(); if(!c.title){ alert("제목을 입력하세요."); return; }
  c.desc=g("c_desc"); c.target=g("c_target"); c.status=g("c_status");
  c.start=g("c_start"); c.end=g("c_end"); c.budget=g("c_budget"); c.capacity=g("c_capacity");
  const i=state.calls.findIndex(x=>x.id===c.id);
  if(i>=0) state.calls[i]=c; else state.calls.unshift(c);
  await saveStore(); state.callEdit=null; render();
}
async function deleteCall(id){
  if(!confirm("이 공모사업을 삭제할까요? 이미 접수된 신청 카드는 그대로 남습니다.")) return;
  const c=state.calls.find(x=>x.id===id); if(c&&c.image)delFile(c.image.key);
  state.calls=state.calls.filter(x=>x.id!==id); await saveStore(); state.callEdit=null; render();
}
async function addCallImage(input){
  const f=input.files[0]; input.value=""; if(!f)return;
  if(!(f.type||"").startsWith("image/")){ alert("이미지 파일만 업로드할 수 있습니다."); return; }
  if(f.size>MAX_FILE){ alert("이미지가 3MB를 초과합니다. 더 작은 이미지를 사용해 주세요."); return; }
  const d=await readFileAsDataUrl(f); const key=await putFile(d); if(!key)return;
  if(state.callEdit.image)delFile(state.callEdit.image.key);
  state.callEdit.image={name:f.name,type:f.type,key}; render();
}
function removeCallImage(){ if(state.callEdit.image)delFile(state.callEdit.image.key); state.callEdit.image=null; render(); }
async function addSetting(key){
  const el=document.getElementById("add_"+key), v=el.value.trim(); if(!v)return;
  if(!state.settings[key].includes(v)) state.settings[key].push(v);
  el.value=""; await saveStore(); render();
}
async function delSetting(key,val){
  state.settings[key]=state.settings[key].filter(x=>x!==val); await saveStore(); render();
}

function exportExcel(){
  if(typeof XLSX==="undefined"){ alert("엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요."); return; }
  const rows=state.orgs.map(o=>{ const r={}; EXPORT_COLS.forEach(c=>r[c.h]=c.get(o)); return r; });
  const ws=XLSX.utils.json_to_sheet(rows,{header:EXPORT_COLS.map(c=>c.h)});
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"참여자");
  const maxLen=Math.max(state.settings.programs.length,state.settings.orgTypes.length,1), setRows=[];
  for(let i=0;i<maxLen;i++) setRows.push({"참여사업":state.settings.programs[i]||"","기관유형":state.settings.orgTypes[i]||""});
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(setRows,{header:["참여사업","기관유형"]}), "설정");
  const callHeader=["ID","제목","소개","신청대상","시작일","마감일","지원규모","모집정원","상태"];
  const callAoa=[callHeader].concat(state.calls.map(c=>[c.id,c.title,c.desc,c.target,c.start,c.end,c.budget,c.capacity,c.status]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(callAoa), "공모사업");
  const settleHeader=["참여자ID","항목","계획금액","집행금액","증빙"];
  const settleAoa=[settleHeader];
  state.orgs.forEach(o=>{ ((o.settlement&&o.settlement.items)||[]).forEach(it=>{ settleAoa.push([o.id,it.name,it.planned,it.spent,it.proof]); }); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(settleAoa), "정산");
  XLSX.writeFile(wb, "사후관리_백업_"+new Date().toISOString().slice(0,10)+".xlsx");
}
function importExcel(input){
  const file=input.files[0]; if(!file) return;
  if(typeof XLSX==="undefined"){ alert("엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."); input.value=""; return; }
  if(!confirm("불러오면 현재 입력된 데이터가 파일 내용으로 모두 교체됩니다. 계속할까요?")){ input.value=""; return; }
  const reader=new FileReader();
  reader.onload=async(e)=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"array"});
      const ws=wb.Sheets["참여자"]||wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      const orgs=rows.map(r=>{ const o=blankOrg("org"); EXPORT_COLS.forEach(c=>{ if(r[c.h]!==undefined)c.set(o,r[c.h]); }); return o; }).filter(o=>o.name);
      const setWs=wb.Sheets["설정"];
      if(setWs){ const sr=XLSX.utils.sheet_to_json(setWs,{defval:""});
        const progs=[...new Set(sr.map(x=>String(x["참여사업"]||"").trim()).filter(Boolean))];
        const types=[...new Set(sr.map(x=>String(x["기관유형"]||"").trim()).filter(Boolean))];
        if(progs.length)state.settings.programs=progs;
        if(types.length)state.settings.orgTypes=types;
      }
      const callWs=wb.Sheets["공모사업"];
      if(callWs){ const cr=XLSX.utils.sheet_to_json(callWs,{defval:""});
        const calls=cr.map(r=>({ id:String(r["ID"]||uidCall()), title:String(r["제목"]||""), desc:String(r["소개"]||""),
          target:String(r["신청대상"]||"둘 다"), start:String(r["시작일"]||"").slice(0,10), end:String(r["마감일"]||"").slice(0,10),
          budget:String(r["지원규모"]||""), capacity:String(r["모집정원"]||""), status:String(r["상태"]||"모집중"),
          createdAt:new Date().toISOString().slice(0,10) })).filter(c=>c.title);
        if(calls.length) state.calls=calls;
      }
      const setlWs=wb.Sheets["정산"];
      if(setlWs){ const lr=XLSX.utils.sheet_to_json(setlWs,{defval:""}); const byId={};
        lr.forEach(r=>{ const id=String(r["참여자ID"]||""); if(!id)return;
          (byId[id]=byId[id]||[]).push({name:String(r["항목"]||""),planned:String(r["계획금액"]||""),spent:String(r["집행금액"]||""),proof:String(r["증빙"]||"")}); });
        orgs.forEach(o=>{ if(byId[o.id]){ if(!o.settlement)o.settlement={status:"미정산",items:[],note:""}; o.settlement.items=byId[o.id]; } });
      }
      state.orgs=orgs; await saveStore(); input.value=""; state.view="list"; render();
      alert(orgs.length+"건을 불러왔습니다.");
    }catch(err){ alert("파일을 읽지 못했습니다. 이 시스템의 ‘내보내기’로 만든 엑셀 파일인지 확인해 주세요."); input.value=""; }
  };
  reader.readAsArrayBuffer(file);
}

function num(v){ const n=parseFloat(String(v==null?"":v).replace(/[^0-9.-]/g,"")); return isNaN(n)?0:n; }
function settleTotalsHtml(s){
  const tp=s.items.reduce((a,it)=>a+num(it.planned),0), ts=s.items.reduce((a,it)=>a+num(it.spent),0);
  const rate=tp>0?Math.round(ts/tp*100):0, bal=tp-ts;
  return `<span>총 계획 <b>${tp.toLocaleString()}원</b></span><span>총 집행 <b>${ts.toLocaleString()}원</b></span><span>집행률 <b>${rate}%</b></span><span>잔액(반환 대상) <b style="${bal<0?'color:#a32d2d':''}">${bal.toLocaleString()}원</b></span>`;
}
function settlementPanel(o){
  if(!o.settlement) o.settlement={status:"미정산",items:[],note:""};
  if(!o.settlement.eval) o.settlement.eval={schedule:"",faithfulness:"",communication:"",note:""};
  const s=o.settlement;
  const rows=s.items.map((it,i)=>`<div class="settle-row">
    <input id="st_name_${i}" value="${esc(it.name||"")}" placeholder="항목명" oninput="settlementSync()">
    <input id="st_plan_${i}" value="${esc(it.planned||"")}" placeholder="계획금액" inputmode="numeric" oninput="settlementSync()">
    <input id="st_spent_${i}" value="${esc(it.spent||"")}" placeholder="집행금액" inputmode="numeric" oninput="settlementSync()">
    <input id="st_proof_${i}" value="${esc(it.proof||"")}" placeholder="증빙(메모·링크)" oninput="settlementSync()">
    <button class="settle-del" onclick="removeSettleRow(${i})" title="삭제">×</button></div>`).join("");
  return `
    <h3 style="margin:22px 0 4px;font-size:14px">사업비 정산</h3>
    <div class="hint">항목별 계획·집행 금액을 넣으면 집행률·잔액이 자동 계산됩니다. 증빙 칸엔 메모나 드라이브 링크를 적어두세요.</div>
    <div class="field" style="max-width:200px"><label>정산 상태</label><select id="st_status">${["미정산","정산중","정산완료"].map(x=>`<option ${s.status===x?"selected":""}>${x}</option>`).join("")}</select></div>
    ${s.items.length?`<div class="settle-head"><span>항목</span><span>계획금액</span><span>집행금액</span><span>증빙(메모·링크)</span><span></span></div>`:""}
    <div id="settleRows">${rows}</div>
    <button class="btn sm" onclick="addSettleRow()" style="margin:4px 0 12px">+ 항목 추가</button>
    <div class="settle-totals" id="settleTotals">${settleTotalsHtml(s)}</div>
    <h3 style="margin:20px 0 4px;font-size:14px">정산·프로젝트 평가</h3>
    <div class="hint">평가가 미흡하면 카드에 ‘정산평가 주의’ 플래그가 떠 집중관리 검토로 이어집니다.</div>
    <div class="diag-grid">${SETTLE_EVAL.map(x=>`<div class="diag-item"><label>${x.label}</label>
      <select id="se_${x.k}" onchange="settlementSync()"><option value="">선택</option>${x.opts.map(op=>`<option ${(s.eval[x.k]||"")===op?"selected":""}>${op}</option>`).join("")}</select></div>`).join("")}</div>
    ${area("기타 특이사항(환수 등)","se_note",s.eval.note||"","예: 정산 대상 아님 / 환수 발생")}
    ${settlePoor(o)?'<div class="flag-warn" style="margin-top:-6px">정산 평가가 미흡합니다. 집중관리 검토를 권합니다.</div>':''}`;
}
function settlementSync(){
  const o=state.orgs.find(x=>x.id===state.activeId); if(!o||!o.settlement)return;
  o.settlement.items.forEach((it,i)=>{
    const gv=id=>{const e=document.getElementById(id);return e?e.value:undefined;};
    const nm=gv("st_name_"+i), pl=gv("st_plan_"+i), sp=gv("st_spent_"+i), pr=gv("st_proof_"+i);
    if(nm!==undefined)it.name=nm; if(pl!==undefined)it.planned=pl; if(sp!==undefined)it.spent=sp; if(pr!==undefined)it.proof=pr;
  });
  const st=document.getElementById("st_status"); if(st)o.settlement.status=st.value;
  if(!o.settlement.eval)o.settlement.eval={};
  SETTLE_EVAL.forEach(x=>{ const e=document.getElementById("se_"+x.k); if(e)o.settlement.eval[x.k]=e.value; });
  const en=document.getElementById("se_note"); if(en)o.settlement.eval.note=en.value;
  const tot=document.getElementById("settleTotals"); if(tot)tot.innerHTML=settleTotalsHtml(o.settlement);
}
function addSettleRow(){ const o=state.orgs.find(x=>x.id===state.activeId); if(!o)return; if(!o.settlement)o.settlement={status:"미정산",items:[],note:""}; settlementSync(); o.settlement.items.push({name:"",planned:"",spent:"",proof:""}); render(); }
function removeSettleRow(i){ const o=state.orgs.find(x=>x.id===state.activeId); if(!o||!o.settlement)return; settlementSync(); o.settlement.items.splice(i,1); render(); }

  state.orgs.forEach(o=>{ if(!o.kind)o.kind="org"; if(o.affiliation===undefined)o.affiliation=""; if(o.sido===undefined){o.sido="";o.sigungu="";} if(o.callId===undefined)o.callId=""; if(o.accountId===undefined)o.accountId=""; if(o.fromParticipant===undefined)o.fromParticipant=false; if(!o.settlement)o.settlement={status:"미정산",items:[],note:""}; if(!o.settlement.eval)o.settlement.eval={schedule:"",faithfulness:"",communication:"",note:""}; if(!o.attachments)o.attachments=[]; if(!o.resultFiles)o.resultFiles=[]; if(o.ageBand===undefined)o.ageBand=""; if(o.scale===undefined)o.scale=""; if(!o.consents)o.consents=blankConsents(); if(o.manager===undefined)o.manager=""; if(!o.kpis)o.kpis=[]; if(!o.activities)o.activities=[]; if(o.reportStatus===undefined)o.reportStatus=""; if(o.reportRejectReason===undefined)o.reportRejectReason=""; });
